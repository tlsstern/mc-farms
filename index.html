<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Farm Plan</title>
<meta name="description" content="Thomas's Minecraft survival farm plan: which farms to build, the video and design for each, and the raw materials to gather.">
<meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Cpath fill='%238a5a35' d='M0 0h8v8H0z'/%3E%3Cpath fill='%236b4426' d='M1 4h1v1H1zM5 3h1v1H5zM3 6h1v1H3zM6 6h1v1H6z'/%3E%3Cpath fill='%23a8743f' d='M2 5h1v1H2zM6 4h1v1H6zM4 7h1v1H4z'/%3E%3Cpath fill='%237fbf3f' d='M0 0h8v2H0zM0 2h1v1H0zM2 2h2v1H2zM5 2h1v1H5zM7 2h1v2H7zM3 3h1v1H3z'/%3E%3Cpath fill='%2399d65a' d='M1 0h1v1H1zM4 0h2v1H4zM6 1h1v1H6zM2 1h1v1H2z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&family=Silkscreen&display=swap">
<style>
  /* ---------- Tokens ---------- */
  :root {
    color-scheme: light dark;
    --bg:#f3efe6; --surface:#fbf8f2; --surface-2:#e9e3d6; --fg:#1d1a15; --muted:#5f584c; --faint:#877f71;
    --line:#ddd5c5; --line-strong:#c6bca8; --press-bg:rgba(60,45,20,.07);
    --accent:#3d7a1a; --accent-fg:#ffffff; --accent-soft:#e0ead0; --accent-ink:#2e6311;
    --danger:#b3392b; --danger-soft:#f6e1da; --warn-soft:#f3e7c8; --warn-ink:#765607;
    --over:#4f8f2a; --nether:#b53a2c; --end:#7b66b3;
    --sk-base:#e6dfd1; --sk-hi:rgba(255,255,255,.6);
    --font: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    --pixel: "Silkscreen", "Schibsted Grotesk", system-ui, sans-serif;
    --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
    --r:6px; /* content rectangles; pressables are pills */
    --header-h:60px; --tab-h:60px; --bar-h:64px; --safe-b: env(safe-area-inset-bottom, 0px);
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-move: cubic-bezier(0.77, 0, 0.175, 1);
    --ease-sheet: cubic-bezier(0.32, 0.72, 0, 1);
    --dur-press:120ms; --dur:200ms; --dur-sheet:300ms;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#121110; --surface:#1b1a17; --surface-2:#24221e; --fg:#eee8dc; --muted:#a9a194; --faint:#7d766a;
      --line:#2b2924; --line-strong:#3f3b34; --press-bg:rgba(255,240,210,.06);
      --accent:#8fcf4a; --accent-fg:#14210a; --accent-soft:#263619; --accent-ink:#a9de6e;
      --danger:#ec7a6a; --danger-soft:#3a201b; --warn-soft:#382f18; --warn-ink:#e6c46a;
      --over:#8fcf4a; --nether:#ec7a6a; --end:#b8a4ec;
      --sk-base:#24221e; --sk-hi:rgba(255,240,210,.06);
    }
  }
  @media (prefers-reduced-motion: reduce) { :root { --dur-press:0ms; --dur:1ms; --dur-sheet:1ms; } }

  /* ---------- web-polish baseline ---------- */
  :root { scrollbar-gutter: stable; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; -webkit-text-size-adjust: 100%; }
  @media (prefers-reduced-motion: no-preference) { :root { scroll-behavior: smooth; } }
  * { box-sizing: border-box; min-width: 0; scrollbar-width: thin; scrollbar-color: var(--line-strong) transparent; }
  body {
    margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 var(--font);
    -webkit-tap-highlight-color: transparent; text-rendering: optimizeLegibility; overscroll-behavior-y: none;
  }
  img, svg, video, canvas, iframe { display:block; max-width:100%; }
  img, svg, button, label, nav, [role="button"], .chip, .seg { user-select:none; -webkit-user-drag:none; }
  :focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  :focus:not(:focus-visible) { outline:none; }
  ::selection { background:var(--accent); color:var(--accent-fg); }
  [id] { scroll-margin-top: calc(var(--header-h) + 12px); }
  h1, h2, h3, h4 { text-wrap:balance; margin:0; }
  p { text-wrap:pretty; margin:0; }
  a { color:inherit; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; touch-action:manipulation; }
  button:disabled { cursor:not-allowed; opacity:.5; }
  ul, ol { margin:0; padding:0; }
  .sr-only { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
  .num { font-variant-numeric: tabular-nums; }
  .skip { position:absolute; left:8px; top:-60px; z-index:100; background:var(--surface); padding:10px 14px; border-radius:8px; }
  .skip:focus { top:8px; }

  /* ---------- motion kit ---------- */
  .press { transition: transform var(--dur-press) var(--ease-out), background-color var(--dur) var(--ease-out), color var(--dur) var(--ease-out), border-color var(--dur) var(--ease-out); }
  .press:active { transform: scale(.97); }
  @keyframes view-in { from { opacity:0; transform: translateY(6px); } }
  .enter { animation: view-in var(--dur) var(--ease-out) backwards; }
  @keyframes item-in { from { opacity:0; transform: translateY(4px); } }
  .stagger > * { animation: item-in var(--dur) var(--ease-out) backwards; animation-delay: calc(min(var(--i, 0), 6) * 30ms); }
  @keyframes fade-in { from { opacity:0; } }
  .swap { animation: fade-in 160ms var(--ease-out) backwards; }

  /* headline reveal (template signature move) */
  .reveal { display:block; overflow:hidden; padding-bottom:.08em; margin-bottom:-.08em; }
  .reveal > span { display:block; animation: rise .7s var(--ease-out) backwards; }
  @keyframes rise { from { transform: translateY(105%); } }

  /* ---------- top bar ---------- */
  .topbar {
    display:flex; align-items:center; gap:16px; height:var(--header-h); padding:0 16px;
    border-bottom:1px solid var(--line); background:color-mix(in oklab, var(--bg) 88%, transparent); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  }
  .brand { display:flex; align-items:center; gap:10px; text-decoration:none; min-height:44px; }
  .brand svg { width:22px; height:22px; flex:none; image-rendering:pixelated; }
  .brand h1 { font:400 17px/1 var(--pixel); letter-spacing:.02em; text-transform:uppercase; }
  .top-progress { margin-left:auto; font-size:13px; color:var(--muted); display:flex; align-items:center; gap:10px; white-space:nowrap; }
  .top-progress .hotbar { width:152px; gap:2px; }

  /* nav: one component, two placements */
  .tabs { position:relative; display:grid; grid-template-columns: repeat(var(--n), 1fr); }
  .tabs a { position:relative; z-index:1; display:flex; align-items:center; justify-content:center; text-decoration:none; color:var(--muted); transition: color var(--dur) var(--ease-out), transform var(--dur-press) var(--ease-out); }
  .tabs a:active { transform: scale(.96); }
  .tabs a[aria-current="page"] { color:var(--accent-ink); }
  .tab-pill { position:absolute; top:0; bottom:0; left:0; width:calc(100% / var(--n)); transform: translateX(calc(var(--i) * 100%)); pointer-events:none; }
  .tab-pill::before { content:""; position:absolute; inset:7px 10px; border-radius:999px; background:var(--accent-soft); }
  .tabs.ready .tab-pill { transition: transform var(--dur) var(--ease-move); }
  .top-tabs { display:none; height:44px; grid-template-columns: repeat(var(--n), 116px); font-size:15px; font-weight:550; }
  .top-tabs .tab-pill::before { inset:4px 6px; border-radius:999px; }
  .top-tabs svg { width:18px; height:18px; margin-right:8px; }

  .tabbar {
    position:fixed; left:0; right:0; bottom:0; z-index:30; background:color-mix(in oklab, var(--bg) 90%, transparent); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    border-top:1px solid var(--line); padding:0 8px var(--safe-b);
  }
  .tabbar .tabs { height:var(--tab-h); }
  .tabbar a { flex-direction:column; gap:3px; font-size:12px; font-weight:600; letter-spacing:.01em; }
  .tabbar svg { width:22px; height:22px; }

  .actionbar {
    position:fixed; left:0; right:0; bottom:calc(var(--tab-h) + var(--safe-b)); z-index:29;
    height:var(--bar-h); padding:10px 16px; background:var(--bg); border-top:1px solid var(--line);
    display:grid; grid-template-columns: 1fr auto; gap:10px;
  }
  .actionbar[hidden] { display:none; }

  /* ---------- layout ---------- */
  main { padding: 0 16px calc(var(--tab-h) + var(--safe-b) + 32px); max-width: 720px; margin: 0 auto; }
  body.has-bar main { padding-bottom: calc(var(--tab-h) + var(--bar-h) + var(--safe-b) + 32px); }
  .foot { color:var(--faint); font-size:13px; padding:28px 0 0; border-top:1px solid var(--line); margin-top:36px; }

  /* ---------- shared bits ---------- */
  .eyebrow { font:650 12px/1.2 var(--font); letter-spacing:.14em; text-transform:uppercase; color:var(--faint); }
  .muted { color:var(--muted); }
  .h2 { font-size:32px; font-weight:560; letter-spacing:-.03em; line-height:1.08; }
  .h3 { font-size:17px; font-weight:650; }
  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 16px;
    border-radius:999px; border:1px solid var(--line-strong); background:transparent; font-weight:600; font-size:15px;
    text-decoration:none; white-space:nowrap;
  }
  .btn svg { width:18px; height:18px; flex:none; }
  .btn-primary { background:var(--accent); border-color:var(--accent); color:var(--accent-fg); }
  .btn-quiet { border-color:transparent; background:transparent; color:var(--muted); padding:0 10px; }
  .icon-btn { width:44px; height:44px; display:inline-grid; place-items:center; border-radius:999px; }
  .icon-btn svg { width:22px; height:22px; }

  .bar { display:flex; height:6px; border-radius:99px; overflow:hidden; background:var(--surface-2); }
  .bar i { display:block; height:100%; }
  .bar .b-built { background:var(--accent); }
  .bar .b-building { background:color-mix(in oklab, var(--accent) 45%, transparent); }
  .bar .b-planned { background:var(--line-strong); }

  .dim { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); white-space:nowrap; }
  .dim::before { content:""; width:8px; height:8px; border-radius:2px; background:currentColor; }
  .dim-overworld::before { background:var(--over); }
  .dim-nether::before { background:var(--nether); }
  .dim-end::before { background:var(--end); }
  .diff { display:inline-flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); white-space:nowrap; }
  .diff b { display:inline-flex; gap:2px; }
  .diff b i { width:4px; height:10px; border-radius:1px; background:var(--line-strong); }
  .diff b i.on { background:var(--fg); }
  .sep { color:var(--line-strong); }

  .pill { display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 10px; border-radius:99px; font-size:13px; font-weight:600; white-space:nowrap; border:1px solid var(--line-strong); color:var(--muted); }
  .pill.s-built { background:var(--accent); border-color:var(--accent); color:var(--accent-fg); }
  .pill.s-building { background:var(--accent-soft); border-color:transparent; color:var(--accent-ink); }
  .pill.s-planned { color:var(--fg); }
  .pill.s-skip { color:var(--faint); text-decoration:line-through; border-style:dashed; }
  .dot { width:8px; height:8px; border-radius:99px; background:var(--line-strong); flex:none; }
  .dot.s-built, .dot.s-building { background:var(--accent); }
  .dot.s-planned { background:var(--fg); }

  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { display:inline-flex; align-items:center; gap:6px; min-height:36px; padding:0 14px; border-radius:99px; border:1px solid var(--line-strong); background:var(--surface); font-size:14px; font-weight:550; }
  .chip[aria-pressed="true"] { background:var(--fg); border-color:var(--fg); color:var(--bg); }
  .tag { display:inline-flex; align-items:center; min-height:26px; padding:2px 10px; border-radius:var(--r); background:var(--surface-2); font-size:13px; color:var(--muted); }
  .feat-list { list-style:none; display:grid; gap:4px; font-size:14px; color:var(--muted); }
  .feat-list li { display:flex; gap:10px; }
  .feat-list li::before { content:""; flex:none; width:5px; height:5px; margin-top:.6em; background:var(--line-strong); }

  /* segmented control with sliding pill */
  .seg { position:relative; display:grid; grid-template-columns:repeat(var(--n), minmax(0,1fr)); padding:3px; border-radius:999px; background:var(--surface-2); }
  .seg-pill { position:absolute; top:3px; bottom:3px; left:3px; width:calc((100% - 6px) / var(--n)); border-radius:999px; background:var(--surface); box-shadow:0 0 0 1px var(--line); transform:translateX(calc(var(--i) * 100%)); transition:transform var(--dur) var(--ease-move), opacity var(--dur) var(--ease-out); pointer-events:none; }
  .seg[data-empty] .seg-pill { opacity:0; }
  .seg button { position:relative; z-index:1; min-height:44px; padding:4px 6px; border-radius:999px; font-size:14px; font-weight:600; color:var(--muted); transition:color var(--dur) var(--ease-out), transform var(--dur-press) var(--ease-out); display:flex; flex-direction:column; align-items:center; justify-content:center; line-height:1.2; }
  .seg button:active { transform:scale(.96); }
  .seg button[aria-pressed="true"] { color:var(--fg); }
  .seg button small { font-size:12px; font-weight:500; color:var(--faint); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .empty { padding:32px 20px; background:var(--surface); border-radius:var(--r); text-align:center; color:var(--muted); display:grid; gap:12px; justify-items:center; }
  .empty b { color:var(--fg); }

  .skeleton { position:relative; overflow:hidden; background:var(--sk-base); border-radius:10px; }
  .skeleton::after { content:""; position:absolute; inset:0; transform:translateX(-100%); background:linear-gradient(90deg, transparent, var(--sk-hi), transparent); animation: shimmer 1.4s var(--ease-move) infinite; }
  @keyframes shimmer { to { transform:translateX(100%); } }
  @media (prefers-reduced-motion: reduce) { .skeleton::after { animation:none; } }

  /* ---------- farm list ---------- */
  .list-head { padding:24px 0 16px; display:grid; gap:14px; }
  .progress-line { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .progress-line strong { font:400 32px/1 var(--pixel); }
  .progress-line strong small { font-size:1em; color:var(--faint); }
  .progress-line span { font-size:14px; color:var(--muted); }
  [data-progress] { display:grid; gap:12px; }
  .hotbar { display:grid; grid-template-columns:repeat(var(--n), minmax(0,1fr)); gap:3px; }
  .hotbar i { aspect-ratio:1; max-height:22px; background:var(--surface-2); box-shadow:inset 0 0 0 1px var(--line-strong); transition:background-color var(--dur) var(--ease-out); }
  .hotbar i.built { background:var(--accent); box-shadow:inset 2px 2px 0 rgb(255 255 255 / .28), inset -2px -2px 0 rgb(0 0 0 / .22); }
  .hotbar i.building { background:color-mix(in oklab, var(--accent) 45%, var(--surface-2)); box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--accent) 60%, transparent); }
  .hotbar i.planned { background:var(--line-strong); box-shadow:none; }
  .top-progress .hotbar i { aspect-ratio:auto; height:8px; box-shadow:none; }
  .top-progress .hotbar i.built { box-shadow:none; }
  .searchrow { display:grid; grid-template-columns: 1fr auto; gap:8px; }
  .field { position:relative; }
  .field svg { position:absolute; left:12px; top:50%; translate:0 -50%; width:18px; height:18px; color:var(--faint); pointer-events:none; }
  .field input {
    -webkit-appearance:none; appearance:none; width:100%; min-height:44px; padding:0 12px 0 38px; font:inherit; font-size:16px;
    color:inherit; background:var(--surface); border:0; border-bottom:1px solid var(--line-strong); border-radius:var(--r) var(--r) 0 0;
    transition:border-color var(--dur) var(--ease-out);
  }
  .field input:focus { border-color:var(--accent); outline:none; }
  .field input::-webkit-search-cancel-button { cursor:pointer; }
  .badge-count { min-width:20px; height:20px; padding:0 6px; border-radius:99px; background:var(--accent); color:var(--accent-fg); font-size:12px; display:inline-grid; place-items:center; }
  .active-filters { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:14px; color:var(--muted); }

  .farm-list { list-style:none; border-top:1px solid var(--line); }
  .farm-list li { border-bottom:1px solid var(--line); }
  .farm-row { display:flex; align-items:center; gap:14px; min-height:76px; padding:12px 8px; margin:0 -8px; border-radius:var(--r); text-decoration:none; transition: background-color var(--dur) var(--ease-out); }
  .farm-row:active { background:var(--press-bg); }
  .farm-row[aria-current="true"] { background:var(--accent-soft); }
  .row-main { flex:1; display:grid; gap:4px; }
  .row-name { font-size:17px; font-weight:600; letter-spacing:-.01em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row-sub { display:flex; align-items:center; gap:8px; flex-wrap:nowrap; overflow:hidden; font-size:13px; color:var(--muted); }
  .row-sub > .dim, .row-sub > .diff { flex:none; }
  .row-sub .creator { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; flex:0 1 auto; }
  .chev { width:18px; height:18px; color:var(--faint); flex:none; }
  .thumb { flex:none; width:88px; aspect-ratio:16/9; border-radius:4px; overflow:hidden; background:var(--surface-2); }
  .thumb img { width:100%; height:100%; object-fit:cover; transition:transform 400ms var(--ease-out); }
  .start-grid { display:grid; grid-template-columns:1fr 1fr; gap:28px 20px; }
  .start-card { display:grid; gap:12px; text-decoration:none; }
  .start-card .thumb { width:100%; border-radius:var(--r); }
  .start-card b { font-size:17px; font-weight:600; letter-spacing:-.01em; }
  .start-card > span:last-child { display:grid; gap:4px; }

  /* ---------- world scan ---------- */
  .coords { font:400 16px/1.2 var(--pixel); letter-spacing:.02em; color:var(--fg); white-space:nowrap; }
  .faint { color:var(--faint); font-size:13px; }
  .world-card { padding:16px; border-radius:var(--r); background:var(--surface); margin-bottom:24px; }
  .world-where { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .world-extras { margin-top:36px; max-width:820px; }
  .wb-list { list-style:none; border-top:1px solid var(--line); }
  .wb { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .wb-main { flex:1; display:grid; gap:4px; }
  .wb-main b { font-size:17px; font-weight:600; letter-spacing:-.01em; }
  .wb-main small { font-size:14px; color:var(--muted); }
  .farm-list li { display:flex; align-items:center; gap:4px; }
  .farm-list li > .farm-row { flex:1; }
  .row-sub .coords { font-size:13px; }
  .portal { display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-size:14px; color:var(--muted); }
  .portal .coords { font-size:14px; }
  .where-row { display:flex; align-items:center; gap:4px 12px; flex-wrap:wrap; }
  .where-row .cmd-copy { margin-left:-8px; }
  .card-actions { display:flex; gap:8px; flex-wrap:wrap; }

  /* build this next */
  .next-card { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:4px 8px; padding:12px; margin:0 -4px; border-radius:var(--r); background:var(--accent-soft); }
  .next-main { display:flex; align-items:center; gap:12px; text-decoration:none; min-height:56px; border-radius:var(--r); }
  .next-main .thumb { width:96px; }
  .next-main > span:last-child { display:grid; gap:2px; }
  .next-main .eyebrow { color:var(--accent-ink); }
  .next-main b { font-size:17px; font-weight:650; letter-spacing:-.01em; }
  .next-main small { font-size:14px; color:var(--muted); }
  .next-card .btn-quiet { padding:0 12px; }
  @media (max-width: 420px) { .next-card { grid-template-columns:1fr; } .next-card .btn-quiet { justify-self:end; min-height:44px; margin:-4px -4px -8px 0; } .next-main .thumb { width:80px; } }

  /* AFK check and plan link */
  .side-block { margin-top:36px; display:grid; gap:12px; }
  .afk-from { display:flex; align-items:center; gap:6px 12px; flex-wrap:wrap; font-size:14px; color:var(--muted); }
  .afk-list { list-style:none; border-top:1px solid var(--line); }
  .afk-list li { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); }
  .afk-list b { font-weight:600; }
  .afk-list small { grid-column:1 / -1; font-size:13px; color:var(--muted); }
  .field-row { display:grid; grid-template-columns:minmax(0,1fr) 96px; gap:12px; }
  .ff select {
    -webkit-appearance:none; appearance:none; width:100%; min-height:44px; padding:0 40px 0 12px; font:inherit; font-size:16px; color:inherit;

  }

  .sheet .ff input, .sheet .ff textarea { background:var(--surface-2); }
  .found { font-size:14px; font-weight:600; color:var(--accent-ink); }

  /* ---------- detail ---------- */

  .d-grid { display:grid; gap:28px; }

  .video { position:relative; aspect-ratio:16/9; border-radius:var(--r); overflow:hidden; background:var(--surface-2); }

  .facts { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:0 20px; margin:0; }
  .facts div { border-top:1px solid var(--line); padding:10px 0 12px; }
  .facts dt { font:650 11px/1.3 var(--font); letter-spacing:.14em; text-transform:uppercase; color:var(--faint); }
  .facts dd { margin:2px 0 0; font-weight:600; overflow-wrap:anywhere; }
  .req-list { display:flex; flex-wrap:wrap; gap:8px; list-style:none; }

  .mods-line { display:flex; flex-wrap:wrap; align-items:center; gap:4px 10px; font-size:15px; }

  .sources { list-style:none; display:grid; gap:2px; }

  /* materials */

  .check-row { display:grid; grid-template-columns: 24px 18px minmax(0,1fr) auto; align-items:center; gap:12px; min-height:52px; padding:6px 4px; cursor:pointer; border-radius:var(--r); transition: background-color var(--dur) var(--ease-out); }
  .check-row:active { background:var(--press-bg); }
  .box { width:24px; height:24px; border:2px solid var(--line-strong); border-radius:4px; display:grid; place-items:center; transition: background-color var(--dur) var(--ease-out), border-color var(--dur) var(--ease-out); }
  .box svg { width:16px; height:16px; }
  .box path { fill:none; stroke:var(--accent-fg); stroke-width:2.5; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:1; stroke-dashoffset:1; transition: stroke-dashoffset 180ms var(--ease-out); }
  input:checked + .box { background:var(--accent); border-color:var(--accent); }
  input:checked + .box path { stroke-dashoffset:0; }
  input:focus-visible + .box { outline:2px solid var(--accent); outline-offset:2px; }
  .sw { width:18px; height:18px; border-radius:2px; background:var(--c, #888); box-shadow: inset 2px 2px 0 rgba(255,255,255,.3), inset -2px -2px 0 rgba(0,0,0,.25); }
  .mat-name { display:grid; transition: color var(--dur) var(--ease-out), opacity var(--dur) var(--ease-out); }
  .mat-name small, .mat-count small { font-size:13px; color:var(--faint); font-weight:400; }
  input:checked ~ .mat-name, input:checked ~ .mat-count { opacity:.5; }
  input:checked ~ .mat-name > span { text-decoration:line-through; text-decoration-color:var(--faint); }
  .mat-count { text-align:right; display:grid; font-variant-numeric:tabular-nums; transition: opacity var(--dur) var(--ease-out); }
  .mat-count b { font-size:17px; font-weight:600; }
  .mat-notes { display:grid; gap:6px; font-size:14px; color:var(--muted); }
  .mat-notes p { display:flex; gap:8px; }
  .mat-notes svg { width:16px; height:16px; flex:none; margin-top:3px; }

  /* materials tab */
  .page-head { padding:24px 0 16px; display:grid; gap:10px; }
  .used-in { list-style:none; display:grid; gap:0; }
  .used-in a { display:flex; align-items:center; gap:10px; min-height:44px; text-decoration:none; justify-content:space-between; border-bottom:1px solid var(--line); }

  /* mods */
  .howto { border-radius:var(--r); background:var(--surface); }
  .howto > button { width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:52px; padding:0 16px; font-weight:600; text-align:left; border-radius:var(--r); }
  .chevron { width:20px; height:20px; transition: transform var(--dur) var(--ease-out); flex:none; }
  [aria-expanded="true"] .chevron { transform: rotate(180deg); }
  .acc { display:grid; grid-template-rows:0fr; transition: grid-template-rows var(--dur) var(--ease-out); }
  .acc[data-open] { grid-template-rows:1fr; }
  .acc > .acc-inner { overflow:hidden; min-height:0; }
  .howto ol { padding:0 16px 0 36px; display:grid; gap:8px; }
  .howto .caveats { padding:12px 16px 16px; display:grid; gap:6px; font-size:14px; color:var(--muted); }
  .mod-group { display:grid; gap:12px; margin-top:28px; }
  .mod-cards { display:grid; gap:0; }
  .mod { padding:18px 0 14px; border-top:1px solid var(--line); display:grid; gap:10px; align-content:start; transition: background-color 600ms var(--ease-out); }
  .mod.flash { background:var(--accent-soft); }
  .mod-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
  .mod-top h4 { font-size:19px; font-weight:600; letter-spacing:-.015em; }
  .mod .badges { display:flex; flex-wrap:wrap; gap:6px; }
  .b { display:inline-flex; align-items:center; gap:6px; min-height:26px; padding:2px 10px; border-radius:4px; font-size:13px; font-weight:600; background:var(--surface-2); color:var(--muted); }
  .b-good { background:var(--accent-soft); color:var(--accent-ink); }
  .b-bad { background:var(--danger-soft); color:var(--danger); }
  .b-warn { background:var(--warn-soft); color:var(--warn-ink); }
  .b-must { background:transparent; color:var(--accent-ink); padding:0; font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
  .hk { padding:4px 16px; border-radius:var(--r); background:var(--surface); }
  .hk h4 { font-size:17px; font-weight:600; padding:12px 0 6px; }
  .hk-row { display:grid; grid-template-columns:minmax(0,11.5rem) minmax(0,1fr); gap:6px 14px; align-items:baseline; padding:10px 0; border-top:1px solid var(--line); font-size:15px; }
  .hk h4 + .hk-row { border-top:0; }
  .hk-keys { display:flex; flex-wrap:wrap; align-items:center; gap:4px; color:var(--faint); font-size:13px; }
  kbd { display:inline-flex; align-items:center; min-height:26px; padding:1px 8px; border-radius:7px; border:1px solid var(--line-strong); border-bottom-width:2px; background:var(--surface-2); color:var(--fg); font:600 13px/1.2 var(--mono); white-space:nowrap; }
  .hk-keys small { font-size:12px; }
  .hk-notes { display:grid; gap:6px; font-size:14px; color:var(--muted); }
  .hk-notes p:first-child { color:var(--fg); }
  @media (max-width: 520px) { .hk-row { grid-template-columns:minmax(0,8.5rem) minmax(0,1fr); gap:4px 12px; } }
  @media (min-width: 1100px) { .hk-cards { display:block; columns:2; column-gap:12px; } .hk-cards .hk { break-inside:avoid; margin-bottom:12px; } .hk-notes { max-width:760px; } }
  .mod small { font-size:13px; color:var(--faint); }
  .mod-video { display:flex; align-items:center; gap:12px; min-height:56px; padding:8px 12px; border-radius:var(--r); background:var(--surface); text-decoration:none; color:var(--fg); }
  .mod-video > svg { width:22px; height:22px; flex:none; }
  .mod-video > svg:last-child { width:16px; height:16px; color:var(--faint); }
  .mod-video span { flex:1; min-width:0; display:grid; gap:2px; font-size:15px; }
  .guide { border-top:1px solid var(--line); }
  .guide-toggle { width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:48px; font-weight:600; text-align:left; border-radius:var(--r); }
  .guide-toggle small { font-weight:500; margin-left:4px; }
  .steps { display:grid; gap:12px; padding:4px 0 8px 22px; font-size:15px; list-style:decimal; }
  .steps li::marker { color:var(--faint); font-variant-numeric:tabular-nums; }
  .steps li { display:list-item; padding-left:4px; }
  .steps li > * + * { margin-top:6px; }
  .cmd { display:flex; align-items:center; gap:4px; border-radius:var(--r); background:var(--surface-2); padding-left:10px; }
  .cmd code { flex:1; min-width:0; font:500 13px/1.45 var(--mono); overflow-wrap:anywhere; padding:8px 0; user-select:all; }
  .cmd-copy { flex:none; display:grid; place-items:center; width:44px; height:44px; border-radius:999px; color:var(--muted); }
  .cmd-copy svg { width:18px; height:18px; }
  .mod .needs a { color:var(--accent-ink); font-weight:600; display:inline-flex; align-items:center; min-height:44px; padding:0 2px; }
  .mod-foot { display:flex; align-items:center; justify-content:space-between; gap:8px; border-top:1px solid var(--line); padding-top:6px; margin-top:2px; }
  .mod-foot .check-row { grid-template-columns: 24px auto; padding-right:8px; }
  .link-out { display:inline-flex; align-items:center; gap:6px; min-height:44px; padding:0 4px; color:var(--accent-ink); font-weight:600; text-decoration:none; font-size:15px; }
  .link-out svg { width:16px; height:16px; }

  /* commands */
  .cmd-list { list-style:none; display:grid; gap:8px; }
  .mycmd { display:flex; align-items:center; gap:2px; padding-right:4px; border-radius:var(--r); background:var(--surface); transition: background-color 600ms var(--ease-out); }
  .mycmd.flash { background:var(--accent-soft); }
  .mycmd-copy { flex:1; display:grid; grid-template-columns:minmax(0,1fr) 20px; align-items:center; gap:2px 12px; min-height:60px; padding:10px 8px 10px 14px; border-radius:var(--r); text-align:left; transition: background-color var(--dur) var(--ease-out); }
  .mycmd-copy:active { background:var(--press-bg); }
  .mycmd-copy b { font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mycmd-copy code { grid-column:1; font:500 13px/1.45 var(--mono); color:var(--muted); overflow-wrap:anywhere; }
  .mycmd-copy .cue { grid-column:2; grid-row:1 / span 2; width:20px; height:20px; color:var(--faint); position:relative; }
  .cue svg { position:absolute; inset:0; width:20px; height:20px; transition: opacity var(--dur) var(--ease-out), transform var(--dur) var(--ease-out); }
  .cue .c-done { opacity:0; transform:scale(.6); color:var(--accent); }
  .copied .cue .c-copy { opacity:0; transform:scale(.6); }
  .copied .cue .c-done { opacity:1; transform:none; }
  .mycmd-copy:not(:has(b)) .cue { grid-row:1; }
  .mycmd .icon-btn { color:var(--muted); flex:none; }
  @media (min-width: 1100px) { .preset-list { grid-template-columns:1fr 1fr; gap:14px 20px; } }
  .preset-group { display:grid; gap:10px; }
  .preset-group + .preset-group { margin-top:18px; }
  .preset-list { list-style:none; display:grid; gap:14px; }
  .preset { display:grid; gap:6px; }
  .preset p { font-size:15px; }
  .tip { display:flex; gap:10px; padding:12px 14px; border-radius:var(--r); background:var(--surface); font-size:14px; color:var(--muted); }
  .tip svg { width:18px; height:18px; flex:none; margin-top:2px; }
  .tip b { color:var(--fg); }
  .ff { display:grid; gap:6px; }
  .ff label { font-size:14px; font-weight:600; }
  .ff input, .ff textarea {
    -webkit-appearance:none; appearance:none; width:100%; min-height:44px; padding:10px 12px; font:inherit; font-size:16px;
    color:inherit; background:var(--surface); border:0; border-bottom:1px solid var(--line-strong); border-radius:var(--r) var(--r) 0 0; transition:border-color var(--dur) var(--ease-out);
  }
  .ff textarea { font-family:var(--mono); font-size:16px; line-height:1.45; min-height:104px; resize:vertical; }
  .ff input:focus, .ff textarea:focus { border-color:var(--accent); outline:none; }
  .ff [aria-invalid="true"] { border-color:var(--danger); }
  .ff small { font-size:13px; color:var(--faint); }
  .ff .err { color:var(--danger); font-size:14px; font-weight:600; }
  @keyframes nudge { 25% { transform:translateX(-4px); } 75% { transform:translateX(4px); } }
  .ff .err:not([hidden]) { animation: nudge 180ms var(--ease-out); }
  .bot-here { justify-self:start; }
  .toast .undo { margin-left:6px; min-height:36px; padding:0 10px; border-radius:8px; color:var(--accent); font-weight:700; }

  /* ---------- sheet ---------- */
  .sheet-wrap { position:fixed; inset:0; z-index:50; }
  .scrim { position:absolute; inset:0; background:rgb(0 0 0 / .42); opacity:0; transition: opacity var(--dur-sheet) var(--ease-out); }
  .sheet {
    position:absolute; left:0; right:0; bottom:0; max-height:85dvh; display:flex; flex-direction:column;
    margin:0 auto; max-width:560px; background:var(--surface); border-radius:16px 16px 0 0;
    padding-bottom: var(--safe-b); transform: translateY(100%); transition: transform var(--dur-sheet) var(--ease-sheet);
  }
  .sheet-wrap[data-open] .scrim { opacity:1; }
  .sheet-wrap[data-open] .sheet { transform: translateY(0); }
  .sheet-grab { touch-action:none; padding:8px 16px 4px; cursor:grab; }
  .sheet-grab::before { content:""; display:block; width:40px; height:5px; border-radius:99px; background:var(--line-strong); margin:0 auto 8px; }
  .sheet-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .sheet-head h2 { font-size:18px; }
  .sheet-body { overflow-y:auto; overscroll-behavior:contain; padding:8px 16px 16px; display:grid; gap:18px; }
  .sheet-foot { padding:12px 16px 16px; display:grid; grid-template-columns:auto 1fr; gap:10px; border-top:1px solid var(--line); }
  .opt-list { list-style:none; display:grid; }
  .opt { width:100%; display:flex; align-items:center; gap:12px; min-height:52px; padding:0 8px; border-radius:var(--r); text-align:left; font-weight:600; }
  .opt:active { background:var(--press-bg); }
  .opt .radio { width:22px; height:22px; border-radius:99px; border:2px solid var(--line-strong); display:grid; place-items:center; transition:border-color var(--dur) var(--ease-out); }
  .opt .radio::after { content:""; width:10px; height:10px; border-radius:99px; background:var(--accent); transform:scale(0); transition:transform var(--dur) var(--ease-out); }
  .opt[aria-checked="true"] .radio { border-color:var(--accent); }
  .opt[aria-checked="true"] .radio::after { transform:scale(1); }
  .opt small { display:block; font-weight:400; color:var(--muted); font-size:13px; }

  /* ---------- toast ---------- */
  .toast {
    position:fixed; left:50%; bottom:calc(var(--tab-h) + var(--safe-b) + 14px); translate:-50% 0; z-index:60;
    background:var(--fg); color:var(--bg); padding:12px 18px; border-radius:999px; font-size:15px; font-weight:600;
    max-width:calc(100vw - 32px); box-shadow:0 8px 24px rgba(0,0,0,.18); display:flex; align-items:center; gap:10px;
    transition: opacity var(--dur) var(--ease-out), transform var(--dur) var(--ease-out);
  }
  body.has-bar .toast { bottom:calc(var(--tab-h) + var(--bar-h) + var(--safe-b) + 14px); }
  @starting-style { .toast { opacity:0; transform: translateY(8px); } }
  .toast.leaving { opacity:0; transform: translateY(4px); }
  .toast svg { width:18px; height:18px; color:var(--accent); }

  /* ---------- hover, pointer devices only ---------- */
  @media (hover: hover) {
    .farm-row:hover { background:var(--press-bg); }
    .farm-row[aria-current="true"]:hover { background:var(--accent-soft); }
    .btn:hover { border-color:var(--fg); }
    .btn-primary:hover { border-color:var(--accent); filter:brightness(1.06); }
    .btn-quiet:hover { color:var(--fg); }
    .chip:hover { border-color:var(--fg); }
    .tabs a:hover, .seg button:hover { color:var(--fg); }
    .check-row:hover { background:var(--press-bg); }
    .play:hover span { background:#c4302b; transform:scale(1.05); }
    .link-out:hover, .mods-line a:hover { text-decoration:underline; }
    .sources a:hover { color:var(--fg); }
    .howto > button:hover { background:var(--press-bg); }
    .mod-video:hover { background:var(--surface-2); }
    .cmd-copy:hover, .guide-toggle:hover { background:var(--press-bg); color:var(--fg); }
    .mycmd-copy:hover { background:var(--press-bg); }
    .mycmd-copy:hover .cue { color:var(--fg); }
        .mycmd .icon-btn:hover { background:var(--press-bg); color:var(--fg); }
    .start-card:hover b { text-decoration:underline; text-underline-offset:4px; text-decoration-thickness:1px; }
    .start-card:hover .thumb img, .farm-row:hover .thumb img { transform:scale(1.04); }
    .used-in a:hover { color:var(--accent-ink); }
  }

  /* ---------- desktop: its own layout ---------- */
  @media (min-width: 900px) {
    .topbar { position:sticky; top:0; z-index:30; padding:0 24px; gap:28px; }
    .top-tabs { display:grid; }
    .tabbar, .actionbar { display:none !important; }
    body.has-bar main, main { padding:0 24px 40px; max-width:1440px; }
    .toast, body.has-bar .toast { bottom:24px; }
    .sheet-wrap .sheet { bottom:24px; border-radius:16px; }

    .split { display:grid; grid-template-columns: 360px minmax(0,1fr); gap:32px; align-items:start; }
    .rail { position:sticky; top:var(--header-h); max-height:calc(100dvh - var(--header-h)); overflow-y:auto; overscroll-behavior:contain; padding:20px 12px 24px 0; scrollbar-gutter:stable; scrollbar-width:thin; scrollbar-color:transparent transparent; transition:scrollbar-color var(--dur) var(--ease-out); }
    .rail:hover, .rail:focus-within { scrollbar-color:var(--line-strong) transparent; }
    .rail .list-head { padding-top:0; }
    .rail .h2 { font-size:24px; }
    .rail .progress-line strong { font-size:24px; }
    .rail .farm-row { margin:0; padding:10px 12px; }
    .rail .thumb { width:60px; }
    .rail .row-sub .creator { display:none; }
    .pane { padding:24px 0 0; min-height:calc(100dvh - var(--header-h) - 40px); }
    .detail-top { display:none; }
    .d-head { grid-template-columns: minmax(0,1fr) auto; align-items:start; column-gap:24px; padding-top:0; }
    .d-head > :not(.d-actions) { grid-column:1; }
    .d-actions { display:flex; grid-column:2; grid-row:1 / span 3; flex-direction:column; align-items:stretch; gap:10px; width:380px; }
    .d-actions .links { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .d-actions .links .btn { min-width:0; overflow:hidden; text-overflow:ellipsis; padding:0 12px; }
    .d-head .h2 { font-size:44px; }
    .d-grid { grid-template-columns: minmax(0, 1.15fr) minmax(360px, 1fr); grid-template-areas: "a b" "c b"; gap:28px 36px; align-items:start; }
    .col-a { grid-area:a; } .col-b { grid-area:b; } .col-c { grid-area:c; }
    .col-b { padding:20px; border-radius:var(--r); background:var(--surface); }
    .facts div { flex-basis:170px; }
    .overview { display:grid; gap:40px; max-width:820px; padding-top:16px; }
    .overview .h2 { font-size:56px; letter-spacing:-.035em; }
    .overview .lead { font-size:18px; max-width:52ch; }
    .tally { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:20px; }
    .tally div { border-top:1px solid var(--line); padding-top:12px; display:grid; gap:6px; }
    .tally b { font:400 32px/1 var(--pixel); }
    .tally b.on { color:var(--accent-ink); }
    .tally span { color:var(--muted); font-size:14px; }
    .overview .hotbar i { max-height:none; }

    .two-col { display:grid; grid-template-columns: 340px minmax(0,1fr); gap:40px; align-items:start; }
    .two-col > aside { position:sticky; top:var(--header-h); padding-top:24px; display:grid; gap:16px; }
    .two-col > section { padding-top:24px; }
    .page-head { padding-top:0; }
    .mat-list.with-used .check-row { grid-template-columns: 24px 18px minmax(0,1fr) minmax(120px, 220px) 110px; }
    .mat-list .used { display:block !important; font-size:13px; color:var(--faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    [data-mod-groups] { columns:2; column-gap:20px; }
    .mod-group { break-inside:avoid; margin:0 0 28px; }
    [data-mod-groups]:has(.hk-cards) { columns:auto; }
    .foot { margin-top:48px; }
  }
  .mat-list .used { display:none; }
  @media (max-width: 899px) { .desk-only { display:none !important; } .chip { min-height:44px; padding:0 16px; } }
  @media (min-width: 900px) { .phone-only { display:none !important; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
  }
</style>

<script>
(function () {
  'use strict';
  const FR = window.FarmRecipes;
  const FP = window.FarmPlan;

  /* ---------- helpers ---------- */
  const $ = (s, el = document) => el.querySelector(s);
  const $$ = (s, el = document) => [...el.querySelectorAll(s)];
  const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const txt = (v) => (v == null || typeof v === 'object' || String(v).trim() === '' || String(v).trim().toLowerCase() === 'null') ? '' : String(v).trim();
  const arr = (v) => Array.isArray(v) ? v : [];
  const safeUrl = (u) => { if (!txt(u)) return ''; try { const x = new URL(String(u)); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch (e) { return ''; } };
  const hostOf = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return ''; } };
  const fmt = (n) => Number(n).toLocaleString('en-US');
  const desktop = window.matchMedia('(min-width: 900px)');

  const store = {
    get(k, d) { try { const v = localStorage.getItem('farmplan:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('farmplan:' + k, JSON.stringify(v)); } catch (e) { /* private mode: keep it in memory */ } },
  };

  const I = {
    chevR: '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>',
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>',
    filter: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>',
    ext: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
    yt: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5.5" width="19" height="13" rx="3.5"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg>',
    down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>',
    copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
    close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    info: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>',
    chevD: '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
    edit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg>',
    bot: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="8" width="14" height="11" rx="2"/><path d="M12 4v4M9.5 13h.01M14.5 13h.01M3 13v2M21 13v2"/></svg>',
    tick: '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7" pathLength="1"/></svg>',
  };

  /* ---------- state ---------- */
  const S = {
    loaded: false, error: null, meta: {}, farms: [], mods: null, modsError: null, world: null,
    q: '', dim: 'all', st: 'all',
    status: store.get('status', {}), design: store.get('design', {}), got: store.get('got', {}),
    installed: store.get('installed', {}), cmds: [].concat(store.get('cmds', [])).filter((c) => c && c.id && c.cmd),
    depthFarm: store.get('depthFarm', 'placed'), depthMats: store.get('depthMats', 'raw'),
    modFilter: store.get('modFilter', 'all'), howto: false,
    coords: store.get('coords', {}), afk: store.get('afk', null), rates: store.get('rates', {}),
    mats: store.get('mats', {}), notNow: [].concat(store.get('notNow', [])),
    navCount: 0, listScroll: 0, prevRoute: null,
  };

  const STATUSES = [
    { v: 'planned', l: 'Planned', d: 'On the list, not started' },
    { v: 'building', l: 'Building', d: 'Gathering or under construction' },
    { v: 'built', l: 'Built', d: 'Done and running' },
    { v: 'skip', l: 'Skip', d: 'Not building this one' },
  ];
  const statusLabel = (v) => (STATUSES.find((s) => s.v === v) || {}).l || '';
  /* what the world scan found (world.json); a status set by hand wins over it */
  const worldOf = (id) => S.world ? S.world.builds.find((b) => b.farm === id) || null : null;
  const valid = (v) => STATUSES.some((s) => s.v === v);
  const statusOf = (id) => valid(S.status[id]) ? S.status[id] : (worldOf(id) && valid(worldOf(id).status) ? worldOf(id).status : '');
  const DEPTHS = [
    { value: 'placed', label: 'As placed' },
    { value: 'ingredients', label: 'Ingredients' },
    { value: 'raw', label: 'Raw' },
  ];
  const DIMS = { overworld: 'Overworld', nether: 'Nether', end: 'The End' };
  const dimOf = (f) => { const d = txt(f.dimension).toLowerCase(); return DIMS[d] ? d : ''; };
  const DIFF = { easy: 1, medium: 2, hard: 3 };

  const designsOf = (f) => [f.primary, ...arr(f.alternatives)].filter((d) => d && typeof d === 'object');
  const designIdx = (f) => { const n = designsOf(f).length; const i = Number(S.design[f.id]) || 0; return i >= 0 && i < n ? i : 0; };
  const designOf = (f) => designsOf(f)[designIdx(f)] || null;
  const farmById = (id) => S.farms.find((f) => f.id === id);
  const today = () => new Date().toISOString().slice(0, 10);

  /* where a farm is: his own coordinates win over the world scan */
  const DIM_OK = (d) => (['overworld', 'nether', 'end'].includes(d) ? d : '');
  function placeOf(id) {
    const c = S.coords[id];
    if (c && Number.isFinite(c.x) && Number.isFinite(c.y) && Number.isFinite(c.z)) return { x: c.x, y: c.y, z: c.z, dim: DIM_OK(c.dim) || 'overworld', mine: true };
    const b = worldOf(id);
    return b && Number.isFinite(b.x) ? { x: b.x, y: b.y, z: b.z, dim: DIM_OK(b.dim) || 'overworld' } : null;
  }
  const xyz = (p) => `${p.x} ${p.y} ${p.z}`;

  /* the material list in use: a pasted Litematica list wins over the researched one */
  const dkey = (f) => `${f.id}|${designIdx(f)}`;
  const pasted = (f) => { const o = S.mats[dkey(f)]; return o && arr(o.list).length ? o : null; };
  function matsOf(f) { const o = pasted(f); if (o) return o.list; const d = designOf(f); return d ? arr(d.materials) : []; }

  /* what the builds he has already make (built farms plus the extra builds from the scan) */
  function producers() {
    const list = S.farms.filter((f) => statusOf(f.id) === 'built').map((f) => ({ id: f.id, name: txt(f.name) || f.id }));
    if (S.world) S.world.builds.filter((b) => !b.farm && FP.PRODUCES[b.id]).forEach((b) => list.push({ id: b.id, name: txt(b.name) || b.id }));
    return list;
  }

  /* ---------- small renderers ---------- */
  function dimBadge(f) { const d = dimOf(f); return d ? `<span class="dim dim-${d}">${DIMS[d]}</span>` : ''; }
  function diffBadge(d) {
    const k = txt(d && d.difficulty).toLowerCase(); const n = DIFF[k];
    if (!n) return '';
    return `<span class="diff" title="Difficulty"><b aria-hidden="true">${[1, 2, 3].map((i) => `<i class="${i <= n ? 'on' : ''}"></i>`).join('')}</b>${k[0].toUpperCase() + k.slice(1)}</span>`;
  }
  function statusPill(id) { const s = statusOf(id); return s ? `<span class="pill s-${s}">${statusLabel(s)}</span>` : ''; }
  function seg(name, opts, current, label) {
    const i = opts.findIndex((o) => o.value === current);
    return `<div class="seg" role="group" aria-label="${esc(label)}" data-seg="${name}" style="--n:${opts.length}; --i:${Math.max(i, 0)}"${i < 0 ? ' data-empty' : ''}>
      <span class="seg-pill" aria-hidden="true"></span>
      ${opts.map((o) => `<button type="button" data-value="${esc(o.value)}" aria-pressed="${o.value === current}">${esc(o.label)}${o.sub ? `<small>${esc(o.sub)}</small>` : ''}</button>`).join('')}
    </div>`;
  }

  function counts() {
    const c = { planned: 0, building: 0, built: 0, skip: 0 };
    S.farms.forEach((f) => { const s = statusOf(f.id); if (s) c[s]++; });
    c.total = S.farms.length - c.skip;
    return c;
  }
  /* one slot per farm, like the hotbar: built, then building, then planned, then empty */
  function progressBar(c) {
    const slots = [['built', c.built], ['building', c.building], ['planned', c.planned], ['', c.total - c.built - c.building - c.planned]]
      .flatMap(([k, n]) => Array.from({ length: Math.max(n, 0) }, () => k ? `<i class="${k}"></i>` : '<i></i>')).join('');
    return `<div class="hotbar" style="--n:${Math.max(c.total, 1)}" role="img" aria-label="${c.built} built, ${c.building} building, ${c.planned} planned of ${c.total}">${slots}</div>`;
  }
  function progressText(c) {
    const rest = [c.building && `${c.building} building`, c.planned && `${c.planned} planned`, c.skip && `${c.skip} skipped`].filter(Boolean).join(' · ');
    return `<div class="progress-line"><strong class="num">${c.built}<small>/${c.total}</small></strong><span class="num">built${rest ? ` · ${rest}` : ''}</span></div>`;
  }
  function refreshProgress() {
    const c = counts();
    $$('[data-progress]').forEach((el) => { el.innerHTML = progressText(c) + progressBar(c); });
    const top = $('[data-top-progress]');
    if (top) top.innerHTML = S.loaded && S.farms.length ? `<span class="num">${c.built}/${c.total} built</span>${progressBar(c)}` : '';
  }

  /* item swatch colour, by keyword */
  const DYE = { white: '#e9ecec', orange: '#f07613', magenta: '#bd44b3', light_blue: '#3aafd9', yellow: '#f8c527', lime: '#70b919', pink: '#ed8dac', gray: '#3e4447', light_gray: '#8e8e86', cyan: '#158991', purple: '#792aac', blue: '#35399d', brown: '#724728', green: '#546d1b', red: '#a12722', black: '#141519' };
  const SWATCH = [
    [/redstone|repeater|comparator|target/, '#c22b23'], [/gold/, '#e8c13a'], [/quartz|observer/, '#e9e3d8'],
    [/slime/, '#79c05a'], [/honey/, '#e9a23b'], [/copper|lightning/, '#c66d47'], [/magma|lava/, '#e0632b'],
    [/water|ice/, '#3f76e4'], [/glass/, '#bfe0e6'], [/^sand$|sandstone/, '#ded09c'], [/gravel/, '#8a817b'],
    [/obsidian/, '#2c2240'], [/string|wool|bed|cobweb/, '#e3e3e3'], [/bamboo|scaffold/, '#b5ae4a'], [/kelp/, '#56722d'],
    [/spruce/, '#6f5030'], [/dark_oak/, '#4a3220'], [/birch/, '#cdb878'], [/crimson/, '#7b3a52'], [/warped/, '#2d7a73'],
    [/cherry/, '#e3b2ad'], [/mangrove/, '#7a3a31'],
    [/hopper|rail|minecart|bucket|cauldron|anvil|chain|lantern|iron/, '#c9ccd0'],
    [/log|planks|stick|chest|barrel|wood|sign|fence|trapdoor|door|ladder|composter|lectern|note_block|bookshelf|crafting|boat|bow|oak|jungle|acacia|button|pressure/, '#a97d48'],
    [/cobble|stone|dropper|dispenser|piston|furnace|lever|deepslate|blackstone/, '#8c8e90'],
    [/turtle|egg/, '#e8e2c4'], [/name_tag|leather|book|paper/, '#c7a26b'], [/soul/, '#5a4436'], [/dirt|mud/, '#866043'],
    [/grass|moss|leaves|vine|sapling/, '#5c9a3a'], [/ender|shulker|end_/, '#8c6fae'], [/coal|charcoal/, '#2d2d2d'],
    [/diamond/, '#5ee3d9'], [/emerald/, '#17b56b'], [/netherrack|nether_brick|wart/, '#7a2e2e'],
  ];
  function swatch(id) {
    const dye = Object.keys(DYE).sort((a, b) => b.length - a.length).find((c) => id.startsWith(c + '_'));
    if (dye) return DYE[dye];
    for (const [re, c] of SWATCH) if (re.test(id)) return c;
    let h = 0; for (const ch of id) h = (h * 31 + ch.charCodeAt(0)) % 360;
    return `hsl(${h} 18% 55%)`;
  }

  /* ---------- material list ---------- */
  function matBlock(res, keyPrefix, opts) {
    opts = opts || {};
    if (!res.items.length) return '';
    /* items a built farm already makes go to the bottom, under their own heading */
    const have = producers();
    const from = new Map(res.items.map((it) => [it.id, FP.suppliersOf(it.id, have)]));
    const row = (it) => {
      const key = keyPrefix + it.id;
      const used = opts.usedBy && opts.usedBy.get(it.id);
      const src = from.get(it.id);
      return `<li><label class="check-row">
        <input type="checkbox" class="sr-only" data-got="${esc(key)}"${S.got[key] ? ' checked' : ''}>
        <span class="box">${I.tick}</span>
        <span class="sw" style="--c:${swatch(it.id)}" aria-hidden="true"></span>
        <span class="mat-name"><span>${esc(it.name)}</span>${it.count == null ? '<small>Count unknown</small>' : ''}${src.length ? `<small class="made-by">From your ${esc(src.join(', '))}</small>` : ''}</span>
        ${opts.usedBy ? `<span class="used">${used ? esc(used.join(', ')) : ''}</span>` : ''}
        <span class="mat-count"><b>${it.count == null ? '?' : fmt(it.count)}</b>${it.stack ? `<small>${esc(it.stack)}</small>` : ''}</span>
      </label></li>`;
    };
    const cls = `mat-list${opts.usedBy ? ' with-used' : ''}`;
    const need = res.items.filter((it) => !from.get(it.id).length);
    const made = res.items.filter((it) => from.get(it.id).length);
    return (need.length ? `<ul class="${cls}">${need.map(row).join('')}</ul>` : '')
      + (made.length ? `<p class="eyebrow supplied-head">Your farms make these</p><ul class="${cls}">${made.map(row).join('')}</ul>` : '');
  }
  function matNotes(res, extra) {
    const notes = [];
    if (res.smelted.length) {
      const from = res.smelted.map((id) => `${FR.prettyName(id)} from ${FR.prettyName(Object.keys(FR.RECIPES[id].in)[0])}`);
      notes.push(`Smelt: ${from.join(', ')}. Fuel is not counted.`);
    }
    if (res.filled.length) notes.push(`Fill buckets with ${res.filled.map((id) => FR.RECIPES[id].fill).join(', ')}.`);
    if (res.leftovers.length) notes.push(`Left over after whole crafts: ${res.leftovers.map((l) => `${fmt(l.count)} ${l.name}`).join(', ')}.`);
    if (extra) notes.push(extra);
    return notes.length ? `<div class="mat-notes">${notes.map((n) => `<p>${I.info}<span>${esc(n)}</span></p>`).join('')}</div>` : '';
  }
  function gatheredLine(res, keyPrefix) {
    const n = res.items.length;
    const got = res.items.filter((it) => S.got[keyPrefix + it.id]).length;
    return `<div class="gathered" data-gathered><span class="num">${got} of ${n} gathered</span><div class="bar"><i class="b-built" style="width:${n ? got / n * 100 : 0}%"></i></div></div>`;
  }
  function listText(res) { return res.items.map((it) => `${it.count == null ? '?' : it.count} x ${it.name}${it.stack ? ` (${it.stack})` : ''}`).join('\n'); }

  const SOURCE_LABEL = { description: 'Video description', schematic: 'Schematic', 'counted-from-video': 'Counted from the video', estimate: 'Estimate' };

  /* ---------- views: farm list ---------- */
  function visibleFarms() {
    const q = S.q.trim().toLowerCase();
    return S.farms.filter((f) => {
      if (S.dim !== 'all' && dimOf(f) !== S.dim) return false;
      const s = statusOf(f.id);
      if (S.st === 'none' ? s : (S.st !== 'all' && s !== S.st)) return false;
      if (!q) return true;
      const d = designOf(f) || {};
      return [f.name, f.id, f.where, d.creator, d.title, ...arr(f.requirements)].map(txt).join(' ').toLowerCase().includes(q);
    });
  }
  function thumb(d) {
    const id = videoIdOf(d || {});
    return `<span class="thumb" aria-hidden="true">${id ? `<img src="https://i.ytimg.com/vi/${encodeURIComponent(id)}/mqdefault.jpg" width="320" height="180" alt="" loading="lazy" decoding="async" draggable="false">` : ''}</span>`;
  }
  function farmRows(activeId, animate) {
    const list = visibleFarms();
    if (!list.length) {
      return `<div class="empty"><p><b>No farms match.</b></p><button type="button" class="btn press" data-action="clear-filters">Clear search and filters</button></div>`;
    }
    return `<ul class="farm-list${animate ? ' stagger' : ''}" id="farm-list">${list.map((f, i) => {
      const d = designOf(f) || {};
      const creator = txt(d.creator);
      const name = txt(f.name) || FR.prettyName(f.id);
      const p = statusOf(f.id) === 'built' ? placeOf(f.id) : null;
      const sub = p ? `<span class="dim dim-${p.dim}" title="${DIMS[p.dim]}"><span class="sr-only">${DIMS[p.dim]}</span></span><span class="coords num">${xyz(p)}</span>` : `${dimBadge(f)}${diffBadge(d)}${creator ? `<span class="creator">${esc(creator)}</span>` : ''}`;
      return `<li style="--i:${i}"><a class="farm-row" href="#/farm/${encodeURIComponent(f.id)}"${f.id === activeId ? ' aria-current="true"' : ''}>
        ${thumb(d)}<span class="row-main"><span class="row-name">${esc(name)}</span>
          <span class="row-sub">${sub}</span></span>
        ${p ? '' : statusPill(f.id) || I.chevR}
      </a>${p ? `<button type="button" class="cmd-copy press" data-action="copy-cmd" data-cmd="${xyz(p)}" data-msg="Coordinates copied" aria-label="Copy coordinates of ${esc(name)}">${I.copy}</button>` : ''}</li>`;
    }).join('')}</ul>`;
  }
  const FILTER_DIMS = [['all', 'All'], ['overworld', 'Overworld'], ['nether', 'Nether'], ['end', 'The End']];
  const FILTER_ST = [['all', 'Any status'], ['none', 'Not set'], ['planned', 'Planned'], ['building', 'Building'], ['built', 'Built'], ['skip', 'Skip']];
  function filterChips() {
    return `<div class="block"><span class="eyebrow">Dimension</span><div class="chips">${FILTER_DIMS.map(([v, l]) => `<button type="button" class="chip press" data-action="f-dim" data-value="${v}" aria-pressed="${S.dim === v}">${l}</button>`).join('')}</div></div>
      <div class="block"><span class="eyebrow">Status</span><div class="chips">${FILTER_ST.map(([v, l]) => `<button type="button" class="chip press" data-action="f-st" data-value="${v}" aria-pressed="${S.st === v}">${l}</button>`).join('')}</div></div>`;
  }
  const activeFilterCount = () => (S.dim !== 'all') + (S.st !== 'all');
  function activeFilterLine() {
    if (!activeFilterCount()) return '';
    const parts = [S.dim !== 'all' && DIMS[S.dim], S.st !== 'all' && FILTER_ST.find((x) => x[0] === S.st)[1]].filter(Boolean);
    return `<div class="active-filters"><span>Showing: ${esc(parts.join(' · '))}</span><button type="button" class="btn btn-quiet press" data-action="clear-filters">Clear</button></div>`;
  }
  function listHead(compact) {
    return `<div class="list-head">
      ${compact ? '' : '<h2 class="h2">Farms</h2>'}
      <div data-progress></div>
      ${compact ? '' : `<div class="phone-only" data-next>${nextCard()}</div>`}
      <div class="searchrow">
        <label class="field"><span class="sr-only">Search farms</span>${I.search}<input type="search" data-search placeholder="Search farms" value="${esc(S.q)}" autocomplete="off" enterkeyhint="search"></label>
        <button type="button" class="btn press phone-only" data-action="filter-open" aria-label="Filter farms">${I.filter}Filter${activeFilterCount() ? `<span class="badge-count">${activeFilterCount()}</span>` : ''}</button>
      </div>
      <div class="desk-only block">${filterChips()}</div>
      <div class="phone-only" data-active-filters>${activeFilterLine()}</div>
    </div>`;
  }
  function refreshList(animate) {
    const r = parse();
    const host = $('[data-list]');
    if (host) host.innerHTML = farmRows(r.name === 'farm' ? r.id : null, animate !== false);
    const af = $('[data-active-filters]'); if (af) af.innerHTML = activeFilterLine();
    const fb = $('[data-action="filter-open"]');
    if (fb) fb.innerHTML = `${I.filter}Filter${activeFilterCount() ? `<span class="badge-count">${activeFilterCount()}</span>` : ''}`;
    $$('.desk-only [data-action="f-dim"], .desk-only [data-action="f-st"]').forEach((b) => b.setAttribute('aria-pressed', String((b.dataset.action === 'f-dim' ? S.dim : S.st) === b.dataset.value)));
  }

  function startHere() {
    const open = S.farms.filter((f) => !['built', 'skip', 'building'].includes(statusOf(f.id)));
    const rank = (f) => DIFF[txt((designOf(f) || {}).difficulty).toLowerCase()] || 2;
    const pick = open.map((f, i) => [f, i]).sort((a, b) => rank(a[0]) - rank(b[0]) || a[1] - b[1]).slice(0, 4).map((x) => x[0]);
    if (!pick.length) return '';
    return `<div class="block"><span class="eyebrow">Easiest ones you haven't built</span><div class="start-grid">${pick.map((f) => { const d = designOf(f) || {}; return `<a class="start-card press" href="#/farm/${encodeURIComponent(f.id)}">${thumb(d)}<span><b>${esc(txt(f.name) || f.id)}</b><span class="row-sub">${dimBadge(f)}${diffBadge(d)}</span></span></a>`; }).join('')}</div></div>`;
  }
  function overviewPane() {
    const c = counts();
    return `<div class="overview">
      <div class="block"><span class="eyebrow">Survival · Java 26.3</span><h2 class="h2">${c.built ? `${c.built} of ${c.total} farms running` : 'Pick a farm to start'}</h2>
      <p class="muted lead">Each farm has a video, the design to build and a material list you can break down to raw materials.</p></div>
      <div class="block">${progressBar(c)}
      <div class="tally">${[['built', 'Built'], ['building', 'Building'], ['planned', 'Planned'], ['skip', 'Skipped']].map(([k, l]) => `<div><b class="num${c[k] && k !== 'skip' ? ' on' : ''}">${c[k]}</b><span>${l}</span></div>`).join('')}</div></div>
      <div data-next>${nextCard()}</div>
      ${startHere()}
      ${afkBlock()}
      ${planBlock()}
    </div>`;
  }

  /* ---------- build this next ---------- */
  function openDims() {
    const open = { nether: false, end: false };
    S.farms.forEach((f) => { const s = statusOf(f.id); if (s === 'built' || s === 'building') { const d = dimOf(f); if (d in open) open[d] = true; } });
    if (S.world) S.world.builds.forEach((b) => { if (b.dim in open) open[b.dim] = true; });
    return open;
  }
  function nextCard() {
    const pick = FP.nextFarm({ status: statusOf, skip: S.notNow, open: openDims(), known: new Set(S.farms.map((f) => f.id)) });
    if (!pick) {
      return S.notNow.length ? `<div class="next-card swap"><p class="muted">You passed on every farm left.</p><button type="button" class="btn btn-quiet press" data-action="next-reset">Start over</button></div>` : '';
    }
    const f = farmById(pick.id);
    return `<div class="next-card swap"><a class="next-main press" href="#/farm/${encodeURIComponent(f.id)}">${thumb(designOf(f))}<span><span class="eyebrow">Build this next</span><b>${esc(txt(f.name) || f.id)}</b><small>${esc(pick.why)}</small></span></a>
      <button type="button" class="btn btn-quiet press" data-action="not-now" data-id="${esc(f.id)}">Not now</button></div>`;
  }
  const refreshNext = () => $$('[data-next]').forEach((el) => { el.innerHTML = nextCard(); });

  /* ---------- AFK check ---------- */
  const VERDICT = { runs: ['b-good', 'Runs'], edge: ['b-warn', 'Edge'], stops: ['b-bad', 'Stops'] };
  function afkBlock() {
    const built = S.farms.filter((f) => statusOf(f.id) === 'built');
    if (!built.length) return '';
    const head = `<div class="block-head"><span class="eyebrow">AFK check</span>${S.afk ? `<button type="button" class="btn btn-quiet press" data-action="afk-open">Change</button>` : ''}</div>`;
    if (!S.afk) {
      return `<section class="block side-block" data-afk>${head}<p class="muted">Where do you stand while you AFK? See which built farms keep running from there.</p>
        <button type="button" class="btn press" data-action="afk-open" style="justify-self:start">Set AFK spot</button></section>`;
    }
    const placed = built.map((f) => ({ f, p: placeOf(f.id) })).filter((x) => x.p);
    const rows = placed.map(({ f, p }) => ({ f, v: FP.afkCheck(f.id, p, S.afk, S.afk.sim) }))
      .sort((a, b) => ['runs', 'edge', 'stops'].indexOf(a.v.state) - ['runs', 'edge', 'stops'].indexOf(b.v.state));
    const missing = built.length - placed.length;
    return `<section class="block side-block" data-afk>${head}
      <p class="afk-from">${dimBadge({ dimension: S.afk.dim })}<span class="coords num">${xyz(S.afk)}</span><span>Simulation distance ${S.afk.sim || 12}</span></p>
      ${rows.length ? `<ul class="afk-list">${rows.map(({ f, v }) => `<li><b>${esc(txt(f.name) || f.id)}</b><span class="b ${VERDICT[v.state][0]}">${VERDICT[v.state][1]}</span><small>${esc(v.why)}</small></li>`).join('')}</ul>` : ''}
      ${missing ? `<small class="faint">${missing} built farm${missing === 1 ? ' has' : 's have'} no coordinates yet. Add them on the farm's page.</small>` : ''}
      <small class="faint">Mob farms need you within 128 blocks; the rest only need their chunks loaded.</small></section>`;
  }
  function afkSheet() {
    const a = S.afk;
    openSheet('AFK spot', `<form data-afk-form style="display:grid;gap:16px" novalidate>
        <div class="ff"><label for="afk-at">Where you stand</label><input id="afk-at" autocomplete="off" spellcheck="false" placeholder="Paste F3 + C, or x y z" value="${a ? esc(xyz(a)) : ''}">
          <p class="err" data-err hidden>Paste F3 + C or type three numbers.</p></div>
        <div class="ff"><label for="afk-dim">Dimension</label><div class="select"><select id="afk-dim">${Object.entries(DIMS).map(([k, l]) => `<option value="${k}"${(a ? a.dim : 'overworld') === k ? ' selected' : ''}>${l}</option>`).join('')}</select></div></div>
        <div class="ff"><label for="afk-sim">Simulation distance (chunks)</label><input id="afk-sim" type="number" inputmode="numeric" min="5" max="32" value="${a ? a.sim : 12}"><small>Options → Video Settings. 12 unless you changed it.</small></div>
      </form>`,
      `${a ? '<button type="button" class="btn btn-quiet press" data-action="afk-clear">Clear</button>' : '<button type="button" class="btn btn-quiet press" data-action="sheet-close">Cancel</button>'}<button type="button" class="btn btn-primary press" data-action="afk-save">Check farms</button>`,
      (wrap) => { const at = $('#afk-at', wrap); at.addEventListener('input', () => { const p = FP.parseCoords(at.value); if (p && p.dim) $('#afk-dim', wrap).value = p.dim; }); });
  }
  function saveAfk() {
    const at = $('#afk-at'); if (!at) return;
    const p = FP.parseCoords(at.value);
    if (!p) { const err = $('[data-afk-form] [data-err]'); err.hidden = true; void err.offsetWidth; err.hidden = false; at.setAttribute('aria-invalid', 'true'); at.focus(); return; }
    const sim = Math.max(5, Math.min(32, Math.round(Number($('#afk-sim').value) || 12)));
    S.afk = { x: p.x, y: p.y, z: p.z, dim: p.dim || $('#afk-dim').value, sim };
    store.set('afk', S.afk); closeSheet(); refreshSide(); toast('AFK spot saved');
  }
  const refreshSide = () => { $$('[data-afk]').forEach((el) => { el.outerHTML = afkBlock(); }); };

  /* ---------- the plan link ---------- */
  function planBlock() {
    return `<section class="block side-block"><span class="eyebrow">Your plan</span>
      <p class="muted">Saved in this browser only. A link carries it to your phone or laptop.</p>
      <button type="button" class="btn press" data-action="plan-copy" style="justify-self:start">${I.copy}Copy my plan link</button></section>`;
  }
  async function copyPlan() {
    const code = await FP.packPlan(Object.fromEntries(FP.PLAN_KEYS.map((k) => [k, S[k]])));
    copy(`${location.href.split('#')[0]}#/plan/${code}`, 1, 'Plan link copied');
  }
  async function offerPlan(code) {
    const plan = await FP.unpackPlan(code);
    if (!plan) { toast("That plan link is broken"); return; }
    const n = (o) => (o && typeof o === 'object' ? Object.keys(o).length : 0);
    const parts = [n(plan.status) && `${n(plan.status)} farm statuses`, n(plan.got) && `${n(plan.got)} ticked materials`, n(plan.installed) && `${n(plan.installed)} installed mods`, arr(plan.cmds).length && `${plan.cmds.length} commands`, n(plan.coords) && `${n(plan.coords)} coordinates`].filter(Boolean);
    openSheet('Load this plan?', `<p>${esc(parts.join(', ') || 'An empty plan')}.</p><p class="muted">It replaces the plan saved in this browser.</p>`,
      `<button type="button" class="btn btn-quiet press" data-action="sheet-close">Keep mine</button><button type="button" class="btn btn-primary press" data-action="plan-load">Load plan</button>`);
    S.pendingPlan = plan;
  }
  function loadPlan() {
    const plan = S.pendingPlan; if (!plan) return;
    FP.PLAN_KEYS.forEach((k) => {
      const v = plan[k];
      if (k === 'cmds') S.cmds = arr(v).filter((c) => c && c.id && c.cmd);
      else if (k === 'notNow') S.notNow = arr(v).filter((x) => typeof x === 'string');
      else if (k === 'afk') S.afk = v && Number.isFinite(v.x) ? v : null;
      else S[k] = v && typeof v === 'object' ? v : {};
      store.set(k, S[k]);
    });
    S.pendingPlan = null; closeSheet(); render(false); toast('Plan loaded');
  }

  /* ---------- views: farm detail ---------- */
  function videoIdOf(d) {
    const ok = (s) => /^[A-Za-z0-9_-]{6,20}$/.test(s || '');
    if (ok(txt(d.video_id))) return txt(d.video_id);
    const u = safeUrl(d.video_url); if (!u) return '';
    try {
      const x = new URL(u);
      if (x.hostname.endsWith('youtu.be')) { const p = x.pathname.slice(1); return ok(p) ? p : ''; }
      const v = x.searchParams.get('v'); if (ok(v)) return v;
      const m = x.pathname.match(/\/(shorts|embed|live)\/([A-Za-z0-9_-]{6,20})/); return m ? m[2] : '';
    } catch (e) { return ''; }
  }
  const ytUrl = (d) => safeUrl(d.video_url) || (videoIdOf(d) ? `https://www.youtube.com/watch?v=${videoIdOf(d)}` : '');

  function videoBlock(d) {
    const id = videoIdOf(d); const title = txt(d.title); const yt = ytUrl(d);
    let inner;
    if (id) {
      inner = `<div class="video" data-vid="${esc(id)}" data-title="${esc(title || 'Farm video')}">
        <img src="https://i.ytimg.com/vi/${encodeURIComponent(id)}/hqdefault.jpg" alt="" width="480" height="360" loading="lazy" decoding="async" draggable="false" onerror="this.remove()">
        <button type="button" class="play" data-action="play" aria-label="Play video${title ? ': ' + esc(title) : ''}"><span>${I.play}</span></button></div>`;
    } else if (yt) {
      inner = `<div class="video"><div class="video-empty"><p>This video can't be embedded.</p><a class="btn press" href="${esc(yt)}" target="_blank" rel="noopener">${I.yt}Watch on ${esc(hostOf(yt))}</a></div></div>`;
    } else {
      inner = `<div class="video"><div class="video-empty"><p><b>No video linked yet.</b><br>Search YouTube for this farm and your version.</p></div></div>`;
    }
    const cap = (title || yt) ? `<div class="video-cap">${title ? `<p>${esc(title)}</p>` : '<span></span>'}${yt ? `<a class="link-out phone-only" href="${esc(yt)}" target="_blank" rel="noopener">${I.yt}YouTube</a>` : ''}</div>` : '';
    return `<div class="block">${inner}${cap}</div>`;
  }
  function factsBlock(d, f) {
    const pub = /^\d{4}-\d{2}-\d{2}$/.test(txt(d.published)) ? txt(d.published) : '';
    const m = S.rates[dkey(f)];
    const measured = m ? `${fmt(m.n)}${m.what ? ' ' + m.what : ' items'}/h, ${m.date}` : '';
    const from = pasted(f) ? `Your Litematica list, ${pasted(f).date}` : SOURCE_LABEL[txt(d.materials_source)] || '';
    const rows = [['Creator', txt(d.creator)], ['Works on', txt(d.works_on)], [measured ? 'Rate claimed' : 'Rate', txt(d.rate)], ['Rate measured', measured], ['Size', txt(d.size)], ['Published', pub], ['Materials from', from]].filter((r) => r[1]);
    if (!rows.length) return '';
    return `<dl class="facts">${rows.map(([k, v], i) => `<div><dt>${k}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>`;
  }
  function schematicBlock(d) {
    const s = d.schematic && typeof d.schematic === 'object' ? d.schematic : {};
    const url = safeUrl(s.url); const format = txt(s.format); const found = txt(s.found_in);
    if (!url) return `<div class="schem is-empty"><span class="eyebrow">Schematic</span><p>No schematic linked. Build from the video.</p></div>`;
    return `<div class="schem"><span class="eyebrow">Schematic</span>
      <div class="schem-row"><a class="btn btn-primary press" href="${esc(url)}" target="_blank" rel="noopener">${I.down}Download${format ? ' ' + esc(format) : ''}</a><span class="muted">${esc(hostOf(url))}</span></div>
      ${found ? `<small class="muted">Found in: ${esc(found)}</small>` : ''}</div>`;
  }
  function usefulMods(f) {
    if (!S.mods) return '';
    const list = arr(S.mods.mods).filter((m) => m && txt(m.id) && arr(m.used_for_farms).includes(f.id));
    if (!list.length) return '';
    return `<div class="block"><span class="eyebrow">Useful mods</span><div class="mods-line">${list.map((m) => `<a href="#/mods/${encodeURIComponent(m.id)}">${esc(txt(m.name) || m.id)}</a>`).join('<span class="sep">·</span>')}</div></div>`;
  }
  function sourcesBlock(f) {
    const src = arr(f.sources).map(txt).filter(Boolean);
    if (!src.length) return '';
    return `<div class="block"><span class="eyebrow">Sources</span><ul class="sources">${src.map((s) => {
      const u = safeUrl(s);
      return u ? `<li><a href="${esc(u)}" target="_blank" rel="noopener">${I.ext}<span>${esc(hostOf(u))}<span class="muted">${esc(new URL(u).pathname.length > 1 ? new URL(u).pathname : '')}</span></span></a></li>` : `<li><span>${esc(s)}</span></li>`;
    }).join('')}</ul></div>`;
  }
  function farmMaterials(f) {
    const d = designOf(f);
    const head = `<div class="block-head"><h3 class="h3">Materials</h3><span style="display:flex;gap:4px"><button type="button" class="btn btn-quiet press" data-action="list-open">Paste list</button><button type="button" class="btn btn-quiet press" data-action="copy-farm">${I.copy}Copy</button></span></div>`;
    const mats = matsOf(f);
    if (!mats.length) {
      return `${head}<div class="empty"><p><b>No material list for this design yet.</b><br>Count from the video, or paste Litematica's material list.</p></div>`;
    }
    const prefix = `${f.id}|${designIdx(f)}${pasted(f) ? 'L' : ''}|${S.depthFarm}|`;
    const res = FR.expand(mats, S.depthFarm);
    const src = d ? txt(d.materials_source) : '';
    const est = pasted(f) ? `Counts from your Litematica list, pasted ${pasted(f).date}.`
      : src === 'estimate' ? 'Counts are an estimate, not from the creator.'
      : src === 'counted-from-video' ? "Counts read off the video. Paste Litematica's list to get exact ones." : '';
    return `${head}<div class="mat-tools">${seg('depthFarm', DEPTHS, S.depthFarm, 'Material depth')}${gatheredLine(res, prefix)}</div>
      <div class="swap" data-mat-block>${matBlock(res, prefix)}${matNotes(res, est)}</div>`;
  }
  function designBody(f) {
    const d = designOf(f);
    if (!d) return `<div class="empty"><p><b>No design researched yet.</b></p></div>`;
    const reqs = arr(f.requirements).map(txt).filter(Boolean);
    const notes = txt(d.notes);
    return `<div class="d-grid">
      <div class="col-a block">${videoBlock(d)}${factsBlock(d, f)}
        ${reqs.length ? `<div class="block"><span class="eyebrow">You need</span><ul class="req-list">${reqs.map((r) => `<li class="tag">${esc(r)}</li>`).join('')}</ul></div>` : ''}</div>
      <div class="col-b block" data-farm-mats>${farmMaterials(f)}</div>
      <div class="col-c block">${notes ? `<div class="block"><span class="eyebrow">Notes</span><p class="note">${esc(notes)}</p></div>` : ''}

  function detailView(f) {

  /* ---------- the world scan ---------- */
  const DIM_ID = { overworld: 'minecraft:overworld', nether: 'minecraft:the_nether', end: 'minecraft:the_end' };
  function tpCmd(b) { const tp = `tp @s ${b.x} ${b.y} ${b.z}`; return b.dim === 'overworld' ? '/' + tp : `/execute in ${DIM_ID[b.dim]} run ${tp}`; }
  const coords = (b) => `<span class="coords num">${b.x} ${b.y} ${b.z}</span>`;
  /* "In your world": where the farm is, the portal spot, the scan, and measuring its rate */
  function whereBlock(f) {
    const b = worldOf(f.id); const p = placeOf(f.id); const built = statusOf(f.id) === 'built';
    if (!b && !p && !built) return '';
    const o = p && FP.otherSide(p);
    const fromScan = b && Number.isFinite(b.x) && !(p && p.mine);
    const source = p && p.mine ? 'Coordinates you entered.'

      ${p ? `<div class="where-row">${dimBadge({ dimension: p.dim })}${coords(p)}<button type="button" class="cmd-copy press" data-action="copy-cmd" data-cmd="${xyz(p)}" data-msg="Coordinates copied" aria-label="Copy coordinates">${I.copy}</button></div>
        ${o ? `<p class="portal"><span>Portal in the ${o.dim === 'nether' ? 'Nether' : 'Overworld'}</span><span class="coords num">${xyz(o)}</span><button type="button" class="cmd-copy press" data-action="copy-cmd" data-cmd="${xyz(o)}" data-msg="Portal coordinates copied" aria-label="Copy portal coordinates">${I.copy}</button></p>` : ''}`
        : `<p class="muted">No coordinates yet. Stand at the farm, press F3 + C and paste it here.</p>`}

  }
  function coordsSheet(f) {
    const p = placeOf(f.id); const mine = S.coords[f.id];
    openSheet(`Where is the ${txt(f.name) || f.id}?`, `<form data-coords-form style="display:grid;gap:16px" novalidate>
        <div class="ff"><label for="co-at">Coordinates</label><input id="co-at" autocomplete="off" spellcheck="false" placeholder="Paste F3 + C, or x y z" value="${p ? esc(xyz(p)) : ''}">
          <p class="err" data-err hidden>Paste F3 + C or type three numbers.</p><small>F3 + C in game copies where you stand, with the dimension.</small></div>
        <div class="ff"><label for="co-dim">Dimension</label><div class="select"><select id="co-dim">${Object.entries(DIMS).map(([k, l]) => `<option value="${k}"${((p && p.dim) || dimOf(f) || 'overworld') === k ? ' selected' : ''}>${l}</option>`).join('')}</select></div></div>
      </form>`,
      `${mine ? '<button type="button" class="btn btn-quiet press" data-action="coords-clear">Remove</button>' : '<button type="button" class="btn btn-quiet press" data-action="sheet-close">Cancel</button>'}<button type="button" class="btn btn-primary press" data-action="coords-save">Save</button>`,
