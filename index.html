  function refreshWhere(f) { const w = $('[data-where]'); if (w) { w.innerHTML = whereBlock(f); w.firstElementChild && w.firstElementChild.classList.add('swap'); } refreshList(false); }

  /* measuring the real rate with Carpet's hopper counters */
  const WOOL = ['white', 'orange', 'magenta', 'light_blue', 'yellow', 'lime', 'pink', 'gray', 'light_gray', 'cyan', 'purple', 'blue', 'brown', 'green', 'red', 'black'];
  function measureSteps(c) {
    const step = (t, cmd) => `<li>${t ? `<p>${t}</p>` : ''}${cmd ? `<div class="cmd"><code>${esc(cmd)}</code><button type="button" class="cmd-copy press" data-action="copy-cmd" data-cmd="${esc(cmd)}" aria-label="Copy ${esc(cmd)}">${I.copy}</button></div>` : ''}</li>`;

  function measureSheet(f) {
    const r = S.rates[dkey(f)]; const c = 'green';

    S.rates[dkey(f)] = { n, what: $('#m-what').value.trim(), date: today() };

  function refreshDesign(f) { const body = $('[data-design-body]'); if (body) { body.innerHTML = designBody(f); body.firstElementChild.classList.add('swap'); } }

  /* pasting Litematica's material list */

  function notFound(what) {

  /* ---------- views: materials tab ---------- */
  function shoppingData() {
    const farms = S.farms.filter((f) => ['planned', 'building'].includes(statusOf(f.id)));
    const all = []; const usedBy = new Map();
    farms.forEach((f) => {
      const mats = matsOf(f);
      all.push(...mats);
      FR.expand(mats, S.depthMats).items.forEach((it) => { if (!usedBy.has(it.id)) usedBy.set(it.id, []); usedBy.get(it.id).push(txt(f.name) || f.id); });
    });
    return { farms, res: FR.expand(all, S.depthMats), usedBy };
  }
  function materialsView() {
    const { farms, res, usedBy } = shoppingData();
    const prefix = `all|${S.depthMats}|`;
    const head = `<div class="page-head"><h2 class="h2">Materials</h2>
      <p class="muted">${farms.length ? `${res.items.length} item${res.items.length === 1 ? '' : 's'} for ${farms.length} farm${farms.length === 1 ? '' : 's'} in progress` : 'For farms marked Planned or Building'}</p></div>`;
    if (!farms.length) {
      return `<div class="enter">${head}<div class="empty"><p><b>Nothing to gather yet.</b><br>Mark a farm Planned or Building and its materials land here.</p><a class="btn btn-primary press" href="#/">Browse farms</a></div></div>`;
    }

    const tools = `<div class="mat-tools">${seg('depthMats', DEPTHS, S.depthMats, 'Material depth')}${gatheredLine(res, prefix)}

  }

  /* ---------- views: mods tab ---------- */
  const CATS = [['map', 'Map'], ['building', 'Building'], ['redstone', 'Redstone'], ['info', 'Info and HUD'], ['movement', 'Movement'], ['performance', 'Performance'], ['enchanting', 'Enchanting and XP'], ['qol', 'Quality of life']];
  function lunarBadge(m) {

  function modCard(m, byId) {

      ${guideHtml(m)}
      ${req.length ? `<p class="needs muted">Needs ${req.map((r) => byId[r] ? `<a href="#/mods/${encodeURIComponent(r)}">${esc(txt(byId[r].name) || r)}</a>` : `<span>${esc(FR.prettyName(r))}</span>`).join(', ')}</p>` : ''}
      <div class="mod-foot">
        <label class="check-row"><input type="checkbox" class="sr-only" data-installed="${esc(id)}"${S.installed[id] ? ' checked' : ''}><span class="box">${I.tick}</span><span class="mat-name">Installed</span></label>

      </div></article>`;

  function guideHtml(m) {
    const g = m.guide; const steps = arr(g && g.steps).filter((s) => s && (txt(s.do) || txt(s.cmd)));

  function hotkeysView(mods) {

  function modsProgress() {

  function modsView() {

    const M = S.mods;
    const meta = [txt(M.client), txt(M.loader), txt(M.minecraft_version)].filter(Boolean).join(' · ');
    const steps = arr(M.how_to_add).map(txt).filter(Boolean);
    const notes = arr(M.notes).map(txt).filter(Boolean);
    const head = `<div class="page-head"><h2 class="h2">Mods</h2>

    else if (act === 'sheet-close') closeSheet();
    else if (act === 'set-status' && f) {
      $$('.opt', a.closest('.opt-list') || document).forEach((o) => o.setAttribute('aria-checked', String(o === a)));
      setStatus(f, a.dataset.value); setTimeout(() => closeSheet(), 160);
    }
    else if (act === 'f-dim' || act === 'f-st') {
      if (act === 'f-dim') S.dim = a.dataset.value; else S.st = a.dataset.value;
      $$(`[data-action="${act}"]`).forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.value === a.dataset.value)));
      refreshList(); const sc = $('[data-show-count]'); if (sc) sc.textContent = `Show ${visibleFarms().length} farms`;
    }
    else if (act === 'clear-filters') {
      S.dim = 'all'; S.st = 'all'; S.q = '';
      const s = $('[data-search]'); if (s) s.value = '';
      $$('[data-action="f-dim"], [data-action="f-st"]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.value === 'all')));
      refreshList(); const sc = $('[data-show-count]'); if (sc) sc.textContent = `Show ${visibleFarms().length} farms`;
    }
    else if (act === 'copy-farm' && f) { const res = FR.expand(matsOf(f), S.depthFarm); if (res.items.length) copy(`${txt(f.name)} (${S.depthFarm})\n` + listText(res), res.items.length); else toast('No materials to copy'); }
    else if (act === 'guide') {
      const open = a.getAttribute('aria-expanded') !== 'true'; a.setAttribute('aria-expanded', String(open));
      const p = document.getElementById(a.getAttribute('aria-controls')); if (p) { p.toggleAttribute('data-open', open); p.toggleAttribute('inert', !open); }
    }
    else if (act === 'copy-cmd') { copy(a.dataset.cmd, 1, a.dataset.msg || 'Command copied'); }
    else if (act === 'cmd-copy') {
      const c = cmdById(a.dataset.id); if (!c) return;
      copy(c.cmd, 1, c.label ? `Copied: ${c.label}` : 'Command copied');
      a.classList.add('copied'); clearTimeout(a._t); a._t = setTimeout(() => a.classList.remove('copied'), 1400);
    }
    else if (act === 'cmd-new') cmdSheet(null);
    else if (act === 'cmd-edit') { const c = cmdById(a.dataset.id); if (c) cmdSheet(c); }
    else if (act === 'cmd-from') cmdSheet({ label: a.dataset.label, cmd: a.dataset.cmd });
    else if (act === 'cmd-save') saveCmd(a.dataset.id);
    else if (act === 'cmd-delete') deleteCmd(a.dataset.id);
    else if (act === 'bot-here') {
      const t = $('#cmd-text'); const m = t && t.value.match(F3C); if (!m) return;
      const [, dim, x, y, z, yaw, pitch] = m;
      t.value = `/player ${botName($('#cmd-label').value)} spawn at ${x} ${y} ${z} facing ${yaw} ${pitch} in ${dim}`;
      a.hidden = true; t.removeAttribute('aria-invalid'); t.focus();
    }
    else if (act === 'copy-all') { const { res } = shoppingData(); copy(`Farm Plan materials (${S.depthMats})\n` + listText(res), res.items.length); }
    else if (act === 'reset-got') {
      const prefix = `all|${S.depthMats}|`; Object.keys(S.got).forEach((k) => { if (k.startsWith(prefix)) delete S.got[k]; });
      store.set('got', S.got); $$('[data-got]').forEach((c) => { c.checked = false; }); updateGathered(); toast('All unticked');
    }
    else if (act === 'howto') {
      S.howto = !S.howto; a.setAttribute('aria-expanded', String(S.howto));
      const p = $('#howto-panel'); p.toggleAttribute('data-open', S.howto); p.toggleAttribute('inert', !S.howto);
    }
    else if (act === 'retry') { boot(); }
    else if (act === 'not-now') { S.notNow.push(a.dataset.id); store.set('notNow', S.notNow); refreshNext(); }
    else if (act === 'next-reset') { S.notNow = []; store.set('notNow', S.notNow); refreshNext(); }
    else if (act === 'afk-open') afkSheet();
    else if (act === 'afk-save') saveAfk();
    else if (act === 'afk-clear') { S.afk = null; store.set('afk', null); closeSheet(); refreshSide(); toast('AFK spot cleared'); }
    else if (act === 'coords-open' && f) coordsSheet(f);
    else if (act === 'coords-save' && f) saveCoords(f);
    else if (act === 'coords-clear' && f) { delete S.coords[f.id]; store.set('coords', S.coords); closeSheet(); refreshWhere(f); toast('Coordinates removed'); }
    else if (act === 'measure-open' && f) measureSheet(f);
    else if (act === 'rate-save' && f) saveRate(f);
    else if (act === 'rate-clear' && f) { delete S.rates[dkey(f)]; store.set('rates', S.rates); closeSheet(); refreshDesign(f); toast('Measured rate removed'); }
    else if (act === 'list-open' && f) listSheet(f);
    else if (act === 'list-save' && f) saveList(f);
    else if (act === 'list-reset' && f) { delete S.mats[dkey(f)]; store.set('mats', S.mats); closeSheet(); refreshDesign(f); toast('Back to the video counts'); }
    else if (act === 'plan-copy') copyPlan();
    else if (act === 'plan-load') loadPlan();
  });

  function updateGathered() {
    $$('[data-mat-block]').forEach((block) => {
      const boxes = $$('[data-got]', block); const got = boxes.filter((b) => b.checked).length;
      const line = block.parentElement.querySelector('[data-gathered]') || $('[data-gathered]');
      if (line) line.innerHTML = `<span class="num">${got} of ${boxes.length} gathered</span><div class="bar"><i class="b-built" style="width:${boxes.length ? got / boxes.length * 100 : 0}%"></i></div>`;
    });
  }
  document.addEventListener('change', (e) => {
    const g = e.target.closest('[data-got]');
    if (g) { if (g.checked) S.got[g.dataset.got] = true; else delete S.got[g.dataset.got]; store.set('got', S.got); updateGathered(); return; }
    const m = e.target.closest('[data-installed]');
    if (m) {
      if (m.checked) S.installed[m.dataset.installed] = true; else delete S.installed[m.dataset.installed];
      store.set('installed', S.installed);
      const p = $('[data-mods-progress]'); if (p) p.innerHTML = modsProgress();
    }
  });
  document.addEventListener('submit', (e) => {
    if (e.target.matches('[data-cmd-form]')) { e.preventDefault(); const b = $('[data-action="cmd-save"]'); saveCmd(b && b.dataset.id); return; }
    if (!e.target.closest('.sheet')) return;
    e.preventDefault();
    const r = parse(); const f = r.name === 'farm' ? farmById(r.id) : null;
    if (e.target.matches('[data-afk-form]')) saveAfk();
    else if (e.target.matches('[data-coords-form]') && f) saveCoords(f);
    else if (e.target.matches('[data-rate-form]') && f) saveRate(f);
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && e.target.matches('#cmd-text')) { e.preventDefault(); e.target.form.requestSubmit(); } });
  document.addEventListener('input', (e) => { if (e.target.matches('[data-search]')) { S.q = e.target.value; refreshList(); } });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && openSheetEl) { e.preventDefault(); closeSheet(); } });
  window.addEventListener('hashchange', () => {
    if (!desktop.matches && S.prevRoute === 'farms') S.listScroll = window.scrollY;
    closeSheet(true); S.navCount++; render(true);
  });
  desktop.addEventListener('change', () => { closeSheet(true); render(false); });

  /* ---------- boot ---------- */
  async function getJson(url) {
    const res = await fetch(url, { cache: 'no-cache' });
    if (!res.ok) throw new Error(`${url} answered ${res.status}`);
    return res.json();
  }
  async function boot() {
    S.error = null; S.modsError = null;
    const slow = setTimeout(() => { if (!S.loaded) view.innerHTML = skeleton(); }, 250);
    const worldP = getJson('world.json').then((w) => { S.world = w && Array.isArray(w.builds) ? w : null; }).catch(() => { S.world = null; });
    const modsP = getJson('mods.json').then((m) => { S.mods = m && typeof m === 'object' ? m : { mods: [] }; }).catch(() => { S.modsError = true; });
    try {
      const data = await getJson('farms.json');
      S.meta = { researched: data.researched, minecraft_version: data.minecraft_version };
      const seen = new Set();
      S.farms = arr(data.farms).filter((f) => f && typeof f === 'object' && txt(f.id) && !seen.has(f.id) && seen.add(f.id));
      await worldP;
      S.loaded = true;
    } catch (e) {
      S.error = e && e.message ? e.message : 'Unknown error';
    }
    clearTimeout(slow);
    render(true);
    if (S.planCode && S.loaded) { const c = S.planCode; S.planCode = null; offerPlan(c); }
    await modsP;
    const r = parse();
    if (r.name === 'mods') render(true);
    else if (r.name === 'farm' && S.mods) { const f = farmById(r.id); const c = $('.col-c'); if (f && c && !$('.mods-line', c)) c.insertAdjacentHTML('beforeend', usefulMods(f)); }
  }
  requestAnimationFrame(() => requestAnimationFrame(() => $$('[data-nav]').forEach((n) => n.classList.add('ready'))));
  setNav(parse());
  boot();
})();
</script>
</body>
</html>
